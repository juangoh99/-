<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f8f5f"><title>轻断食 16:8</title>
<style>
:root{--g:#1f8f5f;--g2:#e9f7ef;--ink:#203128;--muted:#718078;--bg:#f4f7f5;--card:#fff;--line:#e6ece8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:82px}
.top{padding:20px 18px 10px}.brand{font-size:14px;color:var(--g);font-weight:700}.top h1{margin:4px 0;font-size:28px}.date{font-size:13px;color:var(--muted)}
.page{display:none;padding:8px 16px}.page.active{display:block}.card{background:var(--card);border-radius:22px;padding:18px;margin:10px 0;box-shadow:0 4px 18px #2447330d}.hero{background:linear-gradient(145deg,#e8f7ee,#fff);text-align:center;padding:24px 18px}.badge{display:inline-block;background:var(--g2);color:var(--g);padding:7px 12px;border-radius:99px;font-size:13px;font-weight:700}.timer{font-size:42px;font-weight:800;letter-spacing:-1px;margin:17px 0 6px}.sub{color:var(--muted);font-size:14px}
button{border:0;border-radius:14px;padding:13px 15px;font-size:16px;width:100%;background:var(--g);color:white;margin:5px 0;font-weight:650}button.secondary{background:#edf4ef;color:#286c49}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f7faf8;border-radius:16px;padding:14px}.stat b{display:block;font-size:21px;margin-bottom:4px}.stat span{font-size:13px;color:var(--muted)}
h2{font-size:20px;margin:2px 0 14px}h3{font-size:16px;margin-bottom:8px}input,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;font-size:16px;margin:5px 0}.row{display:flex;gap:8px}.row>*{flex:1}.progress{height:10px;background:#e8eee9;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--g);width:0}.item{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}.pill{float:right;background:var(--g2);color:var(--g);padding:4px 8px;border-radius:99px;font-size:12px}.muted{color:var(--muted);font-size:13px}.empty{text-align:center;color:var(--muted);padding:18px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px;z-index:10}nav button{background:none;color:#718078;margin:0;padding:5px 1px;font-size:11px}nav button.on{color:var(--g)}nav button .ico{font-size:20px;display:block;margin-bottom:2px}
</style></head><body><div class="app">
<div class="top"><div class="brand">轻断食 · 16:8</div><h1>今天也要好好照顾自己</h1><div id="today" class="date"></div></div>

<section id="home" class="page active">
<div class="card hero"><div id="state" class="badge">进食时间</div><div id="timer" class="timer">可以吃东西</div><div id="sched" class="sub">进食 12:00–20:00</div><button onclick="startFast()">开始断食</button><button class="secondary" onclick="stopFast()">结束断食</button><button class="secondary" onclick="show('settings')">⚙️ 设置16:8时间</button></div>
<div class="grid"><div class="stat"><b id="cal">0</b><span>今日 kcal</span></div><div class="stat"><b id="wat">0</b><span>今日喝水 ml</span></div><div class="stat"><b id="wt">—</b><span>今日体重 kg</span></div><div class="stat"><b id="meal">0</b><span>饮食记录</span></div></div>
<div class="card"><h2>今日进度</h2><div class="sub">热量 <span id="calPct">0 / 1600 kcal</span></div><div class="progress"><div id="calBar" class="bar"></div></div><br><div class="sub">喝水 <span id="watPct">0 / 2000 ml</span></div><div class="progress"><div id="watBar" class="bar"></div></div></div>
</section>

<section id="diet" class="page"><div class="card"><h2>🍽️ 今日饮食</h2><input id="foodName" placeholder="食物名称"><input id="foodCal" type="number" placeholder="卡路里 kcal"><button onclick="addFood()">＋ 添加饮食</button><div id="dietList"></div></div></section>

<section id="water" class="page"><div class="card"><h2>💧 今日喝水</h2><div class="timer" style="font-size:32px;text-align:center" id="waterTotal">0 ml</div><div class="progress"><div id="waterBar" class="bar"></div></div><p class="muted" style="text-align:center">目标 2000 ml</p><div class="row"><input id="waterAmount" type="number" value="250"><button onclick="addWater()">记录一杯</button></div><h3>喝水计划</h3><input id="drinkTime" type="time"><button class="secondary" onclick="saveDrinkTime()">保存提醒时间</button></div></section>

<section id="records" class="page"><div class="card"><h2>📅 今日记录</h2><div id="recordBox"></div></div></section>

<section id="plan" class="page"><div class="card"><h2>🎯 我的减脂计划</h2><input id="height" type="number" placeholder="身高（cm）"><input id="weight" type="number" placeholder="体重（kg）"><input id="age" type="number" placeholder="年龄"><select id="sex"><option value="f">女性</option><option value="m">男性</option></select><select id="activity"><option value="1.2">久坐/少运动</option><option value="1.375">轻度运动</option><option value="1.55">中度运动</option><option value="1.725">较多运动</option></select><button onclick="makePlan()">生成我的计划</button><div id="planResult"></div></div></section>

<section id="settings" class="page"><div class="card"><h2>⚙️ 16:8 时间设置</h2><p class="muted">你可以根据作息调整进食窗口。</p><label>开始进食</label><input id="eatStart" type="time"><label>结束进食</label><input id="eatEnd" type="time"><button onclick="saveSchedule()">保存设置</button></div></section>

<nav><button data-p="home" class="on" onclick="show('home')"><span class="ico">⌂</span>首页</button><button data-p="diet" onclick="show('diet')"><span class="ico">🍽</span>饮食</button><button data-p="water" onclick="show('water')"><span class="ico">💧</span>喝水</button><button data-p="records" onclick="show('records')"><span class="ico">▣</span>记录</button><button data-p="plan" onclick="show('plan')"><span class="ico">◎</span>计划</button></nav></div>

<script>
const KEY="fast168_pro";let d=JSON.parse(localStorage.getItem(KEY)||"{}");d.s=d.s||"12:00";d.e=d.e||"20:00";d.water=d.water||0;d.goal=d.goal||1600;d.food=d.food||[];d.weight=d.weight||"";let fastEnd=+localStorage.getItem(KEY+"_end")||0;
const save=()=>localStorage.setItem(KEY,JSON.stringify(d)),mins=t=>{let a=t.split(":").map(Number);return a[0]*60+a[1]},eat=()=>{let n=new Date(),v=n.getHours()*60+n.getMinutes(),a=mins(d.s),b=mins(d.e);return a<=b?v>=a&&v<b:v>=a||v<b};
function show(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.p===id));if(id==="diet")renderDiet();if(id==="water")renderWater();if(id==="records")renderRecords()}
function startFast(){let n=new Date(),x=new Date(n),a=d.s.split(":").map(Number);x.setHours(a[0],a[1],0,0);if(x<=n)x.setDate(x.getDate()+1);fastEnd=x.getTime();localStorage.setItem(KEY+"_end",fastEnd);render()}
function stopFast(){fastEnd=0;localStorage.removeItem(KEY+"_end");render()}
function render(){today.textContent=new Date().toLocaleDateString("zh-CN",{weekday:"long",month:"long",day:"numeric"});sched.textContent=`进食 ${d.s}–${d.e}`;let c=d.food.reduce((a,x)=>a+x.k,0);cal.textContent=c;wat.textContent=d.water;meal.textContent=d.food.length;wt.textContent=d.weight||"—";calPct.textContent=`${c} / ${d.goal} kcal`;watPct.textContent=`${d.water} / 2000 ml`;calBar.style.width=Math.min(100,c/d.goal*100)+"%";watBar.style.width=Math.min(100,d.water/2000*100)+"%";let on=fastEnd>Date.now();state.textContent=on?"断食中":eat()?"进食时间":"断食时间";let q=Math.max(0,Math.floor((fastEnd-Date.now())/1000));timer.textContent=on?`${Math.floor(q/3600)}小时 ${Math.floor(q%3600/60)}分钟 ${q%60}秒`:eat()?"可以吃东西":"可以开始断食"}
function addFood(){let n=foodName.value.trim(),k=+foodCal.value;if(!n||!k)return alert("请填写食物和卡路里");d.food.push({n,k,t:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})});save();foodName.value="";foodCal.value="";renderDiet();render()}
function renderDiet(){dietList.innerHTML=d.food.length?d.food.map(x=>`<div class=item>${x.t}　${x.n}<span class=pill>${x.k} kcal</span></div>`).join(""):"<div class=empty>今天还没有饮食记录</div>"}
function addWater(){d.water+=(+waterAmount.value||250);save();renderWater();render()}
function renderWater(){waterTotal.textContent=d.water+" ml";waterBar.style.width=Math.min(100,d.water/2000*100)+"%";drinkTime.value=d.drinkTime||"09:00"}
function saveDrinkTime(){d.drinkTime=drinkTime.value;save();alert("喝水提醒时间已保存")}
function renderRecords(){recordBox.innerHTML=`<div class=item>进食时间：${d.s}–${d.e}</div><div class=item>喝水：${d.water}/2000 ml</div><div class=item>摄取：${d.food.reduce((a,x)=>a+x.k,0)} kcal</div><div class=item>饮食次数：${d.food.length}</div>`}
function saveSchedule(){d.s=eatStart.value||"12:00";d.e=eatEnd.value||"20:00";save();render();alert("16:8时间已保存");show("home")}
function makePlan(){let H=+height.value,W=+weight.value,A=+age.value;if(!H||!W||!A)return alert("请填写身高、体重和年龄");d.weight=W;save();let bmi=W/(H/100)**2,bmr=sex.value==="f"?10*W+6.25*H-5*A-161:10*W+6.25*H-5*A+5,t=bmr*+activity.value,target=Math.max(1200,Math.round(t-400));planResult.innerHTML=`<div class=card><b>BMI：${bmi.toFixed(1)}</b><br>估算维持热量：${Math.round(t)} kcal/天<br><b>减脂热量参考：约 ${target} kcal/天</b><p class=muted>这是估算值，不是医疗建议。</p></div>`}
eatStart.value=d.s;eatEnd.value=d.e;setInterval(render,1000);render();renderDiet();renderWater();
</script></body></html>
