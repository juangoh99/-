<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fb"><link rel="manifest" href="manifest.json"><title>每日自律打卡</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fb;color:#222;font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}.app{max-width:520px;margin:auto;padding:18px 16px 30px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:25px;margin:0}.date{border:0;border-radius:14px;padding:10px;background:#fff}.card{background:#fff;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0000000a}.percent{text-align:center;font-size:28px;font-weight:700}.bar{height:10px;background:#eceef3;border-radius:99px;overflow:hidden}.fill{height:100%;background:#6d8df7;width:0}.task{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid #eee}.check{width:28px;height:28px;border:2px solid #ccd0da;border-radius:50%;display:grid;place-items:center;flex:none}.done .check{background:#6d8df7;color:#fff;border-color:#6d8df7}.done .label{text-decoration:line-through;color:#999}.label{font-size:17px;flex:1}.sub{font-size:13px;color:#999;margin-top:3px}.water{display:flex;align-items:center;gap:8px}.water button,.add{border:0;background:#eef2ff;border-radius:12px;width:42px;height:42px;font-size:22px}.addrow{display:flex;align-items:center;gap:10px;padding-top:12px}.add{width:auto;padding:0 16px;font-size:15px}.nav{display:flex;gap:8px}.nav button{flex:1;border:0;border-radius:13px;background:#fff;padding:12px}.modal{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px}.sheet input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin:8px 0}.sheet button{border:0;border-radius:13px;padding:13px 18px;font-size:16px}.primary{background:#6d8df7;color:#fff}.cancel{background:#eee}</style></head><body><div class="app"><div class="top"><h1>每日自律打卡</h1><input id="date" class="date" type="date"></div><div class="card"><div id="dt" style="text-align:center;color:#777"></div><div id="pct" class="percent">0%</div><div class="bar"><div id="fill" class="fill"></div></div></div><div class="card" id="tasks"></div><div class="nav"><button onclick="move(-1)">‹ 前一天</button><button onclick="today()">今天</button><button onclick="move(1)">后一天 ›</button></div></div><div id="modal" class="modal"><div class="sheet"><h2 style="margin:0">添加项目</h2><input id="newName" placeholder="项目名称，例如：阅读20分钟"><input id="newSub" placeholder="目标/时间，例如：睡前完成"><div style="display:flex;gap:10px;justify-content:flex-end"><button class="cancel" onclick="closeModal()">取消</button><button class="primary" onclick="addProject()">添加</button></div></div></div><script>
let cur=new Date(),defaults=[["wake","🌅","早起","7:00 AM"],["water","💧","喝水","8杯"],["meditate","🧘","打坐","9:00 PM · 20分钟"],["sleep","🌙","早睡","10:30 PM"]];const $=x=>document.getElementById(x),ds=d=>d.toISOString().slice(0,10),key=id=>"habit_"+ds(cur)+"_"+id;
function get(id){return localStorage.getItem(key(id))==="1"}function set(id,v){localStorage.setItem(key(id),v?"1":"0");render()}function water(){return +(localStorage.getItem(key("water"))||0)}function setWater(n){localStorage.setItem(key("water"),Math.max(0,Math.min(8,n)));render()}function bike(){let d=cur.getDay();return d==1||d==3||d==5}function projects(){return JSON.parse(localStorage.getItem("customProjects")||"[]")}function render(){date.value=ds(cur);let names=["日","一","二","三","四","五","六"];dt.textContent=`${cur.getFullYear()}年${cur.getMonth()+1}月${cur.getDate()}日 · 星期${names[cur.getDay()]}`;let a=[...defaults];if(bike())a.splice(3,0,["bike","🚴","健身房踩脚车","20分钟"]);projects().forEach((p,i)=>a.push(["custom_"+i,"📝",p.name,p.sub||"自定义项目"]));let done=a.filter(x=>x[0]=="water"?water()==8:get(x[0])).length,p=Math.round(done/a.length*100);pct.textContent=p+"%";fill.style.width=p+"%";tasks.innerHTML="";a.forEach(x=>{if(x[0]=="water")tasks.innerHTML+=`<div class="task"><div style="font-size:26px">💧</div><div class="label">喝水<div class="sub">目标 8 杯</div></div><div class="water"><button onclick="event.stopPropagation();setWater(water()-1)">−</button><div style="min-width:55px;text-align:center;font-weight:700">${water()}/8</div><button onclick="event.stopPropagation();setWater(water()+1)">＋</button></div></div>`;else tasks.innerHTML+=`<div class="task ${get(x[0])?'done':''}" onclick="set('${x[0]}',!get('${x[0]}'))"><div class="check">${get(x[0])?'✓':''}</div><div class="label">${x[1]} ${x[2]}<div class="sub">${x[3]}</div></div></div>`});tasks.innerHTML+=`<div class="addrow"><button class="add" onclick="openModal()">＋ 添加项目</button><span style="color:#999;font-size:13px">自定义任务</span></div>`}
function openModal(){modal.style.display="flex";newName.value="";newSub.value=""}function closeModal(){modal.style.display="none"}function addProject(){let n=newName.value.trim();if(!n)return alert("请填写项目名称");let a=projects();a.push({name:n,sub:newSub.value.trim()});localStorage.setItem("customProjects",JSON.stringify(a));closeModal();render()}date.onchange=()=>{cur=new Date(date.value+"T12:00:00");render()};function move(n){cur.setDate(cur.getDate()+n);render()}function today(){cur=new Date();render()}if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");render();
</script></body></html>
